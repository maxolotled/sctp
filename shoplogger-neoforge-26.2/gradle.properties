# Points Gradle at the portable JDK 25 also used by shoplogger-v26.2/v26.3 —
# 26.x ships Java 25 to end users, so mods must target it. See those trees'
# gradle.properties for why it's not installed system-wide on this machine.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.101-hotspot

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.2
minecraft_version_range=[26.2]
# Built/tested against the latest at time of release, but the mod's
# mods.toml requires only neo_version_min (the earliest 26.2 build) — using
# the exact latest patch as the floor makes the mod refuse to load on any
# player whose installed NeoForge is one patch behind, which happens
# constantly on beta/fast-moving channels. See neoforge.mods.toml.
neo_version=26.2.0.88
neo_version_min=26.2.0.0

## Mod Properties
mod_id=shoplogger
mod_name=Shop Logger
mod_license=MIT
mod_version=2.2
mod_group_id=com.snailtools
