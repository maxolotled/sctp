# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache for the
# unobfuscated (26.x) toolchain, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Points Gradle at the portable JDK 25 shared with the sibling shoplogger-v26
# project (../shoplogger-v26/.jdk/) — 26.x requires Java 25, which isn't
# installed system-wide on this machine. Reused rather than duplicated here
# (it's ~300MB) since shoplogger-v26 is always checked out alongside this one.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.101-hotspot

# Fabric properties
# Minecraft 26.1+ ships unobfuscated, so there are no Yarn mappings anymore —
# see https://docs.fabricmc.net/develop/porting/mappings/. This project
# targets 26.2 specifically (as opposed to shoplogger-v26, which targets the
# 26.1.x floor) because a handful of Minecraft method names changed between
# 26.1 and 26.2 even though both ship unobfuscated — see the mixins for
# details on exactly what differs.
minecraft_version=26.2
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=1.5.1
maven_group=com.snailtools
archives_base_name=shoplogger

# Dependencies
fabric_version=0.155.2+26.2
