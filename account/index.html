<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account Settings - SCTP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23101B14'/><circle cx='100' cy='100' r='60' fill='%23B7E23D'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
	:root{
		--bg:#101B14; --panel:#1B2A20; --panel-alt:#22332A; --line:#33453A;
		--muted:#8FA593; --text:#EAEFE7; --shell:#D9C89A;
		--accent:#B7E23D; --accent-dim:#87AE29; --accent-ink:#16210F;
		--warn:#E2A33D; --bad:#E2643D;
		--font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
	}
	*{box-sizing:border-box;}
	body{margin:0;background:radial-gradient(1200px 500px at 15% -10%, rgba(183,226,61,0.07), transparent 60%), var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.5;}
	a{color:var(--accent);}
	.wrap{max-width:640px;margin:0 auto;padding:0 24px;}
	header.site{border-bottom:1px solid var(--line);padding:24px 0;}
	.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
	.brand-row{display:flex;align-items:center;gap:12px;}
	.brand-mark{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:17px;}
	header.site h1{font-family:var(--font-display);font-weight:600;font-size:23px;margin:0;}
	.nav-links{display:flex;gap:16px;align-items:center;}
	.nav-links a{color:var(--shell);text-decoration:none;font-size:14px;font-weight:600;}
	.nav-links a:hover{color:var(--accent);}

	main{padding:32px 0 60px;}
	h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 4px;}
	.lede{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
	section{margin-bottom:28px;}

	.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;}
	.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
	.field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
	input[type=text],input[type=password]{
		width:100%;box-sizing:border-box;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:8px;padding:9px 12px;font-family:inherit;font-size:14px;
	}
	input:focus{outline:none;border-color:var(--accent-dim);}
	.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
	.btn:hover{background:var(--accent-dim);}
	.err{color:var(--bad);font-size:12.5px;margin:10px 0 0;}
	.ok{color:var(--accent);font-size:12.5px;margin:10px 0 0;}
	.warn-note{background:rgba(226,163,61,0.12);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;}
	.readonly-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-alt);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:14px;}
	.readonly-row .v{color:var(--muted);}
	.verified{color:var(--accent);}
	.empty{color:var(--muted);font-size:13.5px;padding:8px 0;}
	.login-cta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13.5px;}
	[hidden]{display:none!important;}
</style>
</head>
<body>

<header class="site">
	<div class="wrap header-row">
		<div class="brand-row">
			<div class="brand-mark">⚙️</div>
			<h1>Account Settings</h1>
		</div>
		<nav id="siteNavMount"></nav>
	</div>
</header>

<main class="wrap">
	<div id="loginCta" class="login-cta" hidden>You need to be logged in to see this. Log in from the button up top.</div>
	<div id="accountContent"></div>
</main>

<script src="/site-nav.js" defer></script>
<script src="/account-widget.js" defer></script>
<script>
(function(){
	"use strict";

	var API_BASE = "https://snailcraft-trading-post.snailcraft-trading-post.workers.dev";

	function esc(s){
		return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
			return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
		});
	}
	function authFetch(path, opts){
		opts = opts || {};
		var s = window.sctpAccount ? window.sctpAccount.getSession() : null;
		var headers = opts.headers || {};
		if(s) headers["Authorization"] = "Bearer " + s.token;
		if(opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
		return fetch(API_BASE + path, { method: opts.method || "GET", headers: headers, body: opts.body }).then(function(r){
			return r.json().then(function(d){ return { ok: r.ok, status: r.status, data: d }; });
		});
	}

	function load(){
		var session = window.sctpAccount ? window.sctpAccount.getSession() : null;
		if(!session){
			document.getElementById("loginCta").hidden = false;
			document.getElementById("accountContent").innerHTML = "";
			return;
		}
		document.getElementById("loginCta").hidden = true;
		document.getElementById("accountContent").innerHTML = '<p class="empty">Loading…</p>';
		authFetch("/account/me").then(function(res){
			if(!res.ok){ document.getElementById("accountContent").innerHTML = '<p class="empty">Couldn\'t load your account.</p>'; return; }
			render(res.data);
		});
	}

	function render(data){
		var host = document.getElementById("accountContent");
		host.innerHTML =
			'<section>' +
				'<h2>Minecraft account</h2>' +
				'<p class="lede">Linked and verified by a head admin — you can\'t edit this yourself.</p>' +
				'<div class="readonly-row"><span>' + esc(data.mcUsername || "Not linked yet") + '</span>' +
					(data.mcVerified ? '<span class="verified">&#10003; Verified</span>' : '<span class="v">Not verified</span>') +
				'</div>' +
			'</section>' +
			'<section>' +
				'<h2>Contact info</h2>' +
				'<p class="lede">Shown to the other party only once a marketplace trade is actually confirmed (a bid you placed or accepted).</p>' +
				'<div class="warn-note">Do not add personal info here — no real names, phone numbers, emails, or addresses. Discord tag and general timezone only.</div>' +
				'<div class="card">' +
					'<div class="field"><label>Discord</label><input type="text" id="acDiscord" maxlength="100" placeholder="e.g. username or username#0000"></div>' +
					'<div class="field"><label>Timezone</label><input type="text" id="acTimezone" maxlength="100" placeholder="e.g. GMT+2, EST"></div>' +
					'<button type="button" class="btn" id="acSaveContact">Save contact info</button>' +
					'<p class="err" id="acContactErr" hidden></p><p class="ok" id="acContactOk" hidden>Saved.</p>' +
				'</div>' +
			'</section>' +
			'<section>' +
				'<h2>Change password</h2>' +
				'<div class="card">' +
					'<div class="field"><label>Current password</label><input type="password" id="acOldPw"></div>' +
					'<div class="field"><label>New password</label><input type="password" id="acNewPw"></div>' +
					'<div class="field"><label>Confirm new password</label><input type="password" id="acNewPw2"></div>' +
					'<button type="button" class="btn" id="acSavePw">Change password</button>' +
					'<p class="err" id="acPwErr" hidden></p><p class="ok" id="acPwOk" hidden>Password changed — please log in again.</p>' +
				'</div>' +
			'</section>';

		document.getElementById("acDiscord").value = data.contactDiscord || "";
		document.getElementById("acTimezone").value = data.contactTimezone || "";

		document.getElementById("acSaveContact").addEventListener("click", function(){
			var errEl = document.getElementById("acContactErr"), okEl = document.getElementById("acContactOk");
			errEl.hidden = true; okEl.hidden = true;
			authFetch("/account/contact-info", { method: "POST", body: JSON.stringify({
				contactDiscord: document.getElementById("acDiscord").value.trim() || undefined,
				contactTimezone: document.getElementById("acTimezone").value.trim() || undefined,
			}) }).then(function(res){
				if(!res.ok){ errEl.textContent = res.data.error || "Couldn't save contact info."; errEl.hidden = false; return; }
				okEl.hidden = false;
			});
		});

		document.getElementById("acSavePw").addEventListener("click", function(){
			var errEl = document.getElementById("acPwErr"), okEl = document.getElementById("acPwOk");
			errEl.hidden = true; okEl.hidden = true;
			var oldPw = document.getElementById("acOldPw").value;
			var newPw = document.getElementById("acNewPw").value;
			var newPw2 = document.getElementById("acNewPw2").value;
			if(newPw.length < 8){ errEl.textContent = "New password must be at least 8 characters."; errEl.hidden = false; return; }
			if(newPw !== newPw2){ errEl.textContent = "New passwords don't match."; errEl.hidden = false; return; }
			authFetch("/admin/admins/change-password", { method: "POST", body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }) }).then(function(res){
				if(!res.ok){ errEl.textContent = res.data.error || "Couldn't change password."; errEl.hidden = false; return; }
				okEl.hidden = false;
				// Changing your own password revokes every session (including this
				// one) server-side. Clear the stale local copy and reload so the
				// header button and this page both reflect being logged out.
				if(window.sctpAccount) window.sctpAccount.clearSession();
				setTimeout(function(){ location.reload(); }, 1200);
			});
		});
	}

	window.sctpOnAccountChange = load;
	if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
	else load();
})();
</script>
</body>
</html>
