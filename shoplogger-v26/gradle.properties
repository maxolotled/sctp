# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache for the
# unobfuscated (26.x) toolchain, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Points Gradle at the portable JDK 25 extracted into this folder (.jdk/) —
# 26.x requires Java 25, which isn't installed system-wide on this machine.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.101-hotspot

# Fabric properties
# Minecraft 26.1+ ships unobfuscated, so there are no Yarn mappings anymore —
# see https://docs.fabricmc.net/develop/porting/mappings/. This project
# targets 26.1.x specifically. It compiles clean against 26.2 too, but the
# mixins crash at runtime there — a few method names changed between 26.1 and
# 26.2 despite both being unobfuscated. See the sibling shoplogger-v26.2
# project for the 26.2 build.
minecraft_version=26.1.2
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=1.5
maven_group=com.snailtools
archives_base_name=shoplogger

# Dependencies
fabric_version=0.155.2+26.1.2
