<style>
	:root{
		--bg:#101B14;
		--panel:#1B2A20;
		--panel-alt:#22332A;
		--line:#33453A;
		--muted:#8FA593;
		--text:#EAEFE7;
		--shell:#D9C89A;
		--accent:#B7E23D;
		--accent-dim:#87AE29;
		--accent-ink:#16210F;
		--info:#8C93E8;
		--font-display:'Fraunces',serif;
		--font-body:'Inter',sans-serif;
		--font-mono:'JetBrains Mono',monospace;
	}
	*{box-sizing:border-box;}
	body{
		margin:0;
		background:
			radial-gradient(1200px 500px at 15% -10%, rgba(183,226,61,0.07), transparent 60%),
			var(--bg);
		color:var(--text);
		font-family:var(--font-body);
		line-height:1.5;
	}
	a{color:var(--accent);}
	.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

	header.site{border-bottom:1px solid var(--line);padding:28px 0 22px;}
	.brand-row{display:flex;align-items:center;gap:14px;}
	.brand-mark{flex:0 0 auto;width:40px;height:40px;filter:drop-shadow(0 4px 10px rgba(183,226,61,0.18));}
	.brand-mark path{fill:var(--accent);}
	header.site h1{
		font-family:var(--font-display);font-weight:600;font-size:30px;
		letter-spacing:0.2px;margin:0 0 4px;
	}
	header.site .tag{color:var(--muted);font-size:14.5px;margin:0;}
	header.site .tag a{color:var(--shell);}

	main{padding:28px 0 60px;}

	.item-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
	.item-tab{
		background:transparent;border:none;border-bottom:2px solid transparent;
		color:var(--muted);font-family:var(--font-body);font-weight:600;font-size:14.5px;
		padding:10px 4px;margin-bottom:-1px;cursor:pointer;
	}
	.item-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
	.item-tab:hover{color:var(--text);}

	.item-search{
		width:100%;max-width:360px;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:10px;padding:10px 14px;font-family:var(--font-body);font-size:14px;margin-bottom:20px;
	}
	.item-search::placeholder{color:var(--muted);}

	.item-grid{
		display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:10px;
	}
	.item-card{
		display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
		background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 8px 12px;
		text-decoration:none;color:var(--text);transition:border-color .12s ease, transform .12s ease;
	}
	.item-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
	.item-card img{width:40px;height:40px;image-rendering:pixelated;}
	.item-card span{font-size:12.5px;line-height:1.3;}

	.item-count{color:var(--muted);font-size:13px;margin:0 0 14px;}

	.rare-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
	.rare-filters select{
		background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:8px;padding:8px 10px;font-family:var(--font-body);font-size:13px;cursor:pointer;
		max-width:200px;
	}
	.rare-filters select:focus{outline:none;border-color:var(--accent-dim);}
	.rare-filters-reset{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;}
	.rare-filters-reset:hover{color:var(--text);border-color:var(--accent-dim);}
	.item-card .cat-pill{
		display:inline-block;font-size:10px;font-family:var(--font-mono);color:var(--muted);
		background:var(--panel-alt);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-top:2px;
	}

	.empty-state{padding:60px 24px;text-align:center;color:var(--muted);}
	.empty-state h3{font-family:var(--font-display);color:var(--text);font-size:19px;margin:0 0 8px;}

	footer.site{padding:20px 0 40px;color:var(--muted);font-size:12.5px;text-align:center;}
</style>
</head>

		</div>

			<a href="/" style="color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;">&larr; Home</a>

</header>

<main class="wrap">
	<div class="item-tabs">
		<button type="button" class="item-tab active" id="tabVanilla">Vanilla Items</button>
		<button type="button" class="item-tab" id="tabRare">Rare Items</button>
	</div>

	<div id="vanillaPane">
		<input type="text" class="item-search" id="itemSearch" placeholder="Search items…">
		<p class="item-count" id="itemCount"></p>
		<div class="item-grid" id="vanillaGrid"></div>
	</div>

	<div id="rarePane" hidden>
		<input type="text" class="item-search" id="rareSearch" placeholder="Search rare items or effects…">
		<div class="rare-filters" id="rareFilters">
			<select id="fCategory"><option value="">All categories</option></select>
			<select id="fObtainedFrom"><option value="">Obtained from: any</option></select>
			<select id="fReleaseDate"><option value="">Release: any</option></select>
			<select id="fTypeSlot"><option value="">Type/Slot: any</option></select>
			<select id="fDyeable"><option value="">Dyeable: any</option></select>
			<button type="button" class="rare-filters-reset" id="fRareReset">Reset filters</button>
		</div>
		<p class="item-count" id="rareCount"></p>
		<div class="item-grid" id="rareGrid"></div>
	</div>
</main>

<footer class="site">
	<div class="wrap">Thanks to LadyMaledicte & Hornzilla for their amazing work on the rare library!</div>
</footer>

<script src="/account-widget.js" defer></script>
<script>
(function(){
	"use strict";

	var PLACEHOLDER_ICON = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2322332A'/><path d='M4 4 L12 12 M12 4 L4 12' stroke='%2333453A' stroke-width='1.5'/></svg>";
	// PLACEHOLDER_ICON's own single quotes would prematurely close the
	// single-quoted JS string it gets embedded into below (inside the
	// double-quoted onerror="..." attribute) — escape them once up front
	// rather than get a silently-broken fallback on every failed image load.
	var PLACEHOLDER_ICON_JS = PLACEHOLDER_ICON.replace(/'/g, "\\'");

	function esc(s){
		return String(s).replace(/[&<>"']/g, function(c){
			return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
		});
	}

	function slugFromBaseItem(baseItem){
		return String(baseItem).replace(/^minecraft:/, "");
	}

	var allItems = [];

	function renderGrid(items){
		document.getElementById("itemCount").textContent = items.length + " item" + (items.length === 1 ? "" : "s");
		document.getElementById("vanillaGrid").innerHTML = items.map(function(it){
			return '<a class="item-card" href="/items/' + esc(slugFromBaseItem(it.baseItem)) + '">' +
				'<img src="' + esc(it.texture) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER_ICON_JS + '\';">' +
				'<span>' + esc(it.name) + '</span>' +
			'</a>';
		}).join("");
	}

	function applySearch(){
		var q = document.getElementById("itemSearch").value.trim().toLowerCase();
		var filtered = q ? allItems.filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; }) : allItems;
		renderGrid(filtered);
	}

	async function loadVanillaItems(){
		try {
			var res = await fetch("/data/vanilla-items.json");
			allItems = res.ok ? await res.json() : [];
		} catch(e){
			allItems = [];
		}
		renderGrid(allItems);
	}

	document.getElementById("itemSearch").addEventListener("input", applySearch);

	// ---------------- rare items ----------------
	var allRareItems = [];
	var rareLoaded = false;
	var RARE_FILTER_FIELDS = [
		{ id: "fCategory", key: "category" },
		{ id: "fObtainedFrom", key: "obtainedFrom" },
		{ id: "fReleaseDate", key: "releaseDate" },
		{ id: "fTypeSlot", key: "typeSlot" },
		{ id: "fDyeable", key: "dyeable" },
	];

	var MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
	function releaseSortKey(s){
		var m = /^([a-z]{3})\w*\s+(\d{4})$/i.exec(String(s||"").trim());
		if(!m) return 0;
		var mi = MONTHS.indexOf(m[1].toLowerCase());
		return parseInt(m[2], 10) * 100 + (mi === -1 ? 0 : mi);
	}

	function renderRareGrid(items){
		document.getElementById("rareCount").textContent = items.length + " item" + (items.length === 1 ? "" : "s");
		document.getElementById("rareGrid").innerHTML = items.map(function(it){
			return '<a class="item-card" href="/items/' + esc(it.id) + '">' +
				'<img src="' + esc(it.texture) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER_ICON_JS + '\';">' +
				'<span>' + esc(it.name) + '<br><span class="cat-pill">' + esc(it.category) + '</span></span>' +
			'</a>';
		}).join("");
	}

	function populateRareFilters(){
		RARE_FILTER_FIELDS.forEach(function(f){
			var values = [];
			var seen = {};
			allRareItems.forEach(function(it){
				var v = it[f.key];
				if(!v) return;
				var vKey = v.toLowerCase();
				if(!seen[vKey]){ seen[vKey] = v; values.push(v); }
			});
			if(f.key === "releaseDate") values.sort(function(a,b){ return releaseSortKey(a) - releaseSortKey(b); });
			else values.sort(function(a,b){ return a.localeCompare(b); });

			var select = document.getElementById(f.id);
			values.forEach(function(v){
				var opt = document.createElement("option");
				opt.value = v.toLowerCase();
				opt.textContent = v;
				select.appendChild(opt);
			});
		});
	}

	function applyRareFilters(){
		var q = document.getElementById("rareSearch").value.trim().toLowerCase();
		var active = {};
		RARE_FILTER_FIELDS.forEach(function(f){ active[f.key] = document.getElementById(f.id).value; });

		var filtered = allRareItems.filter(function(it){
			if(q){
				var haystack = (it.name + " " + (it.effect||"")).toLowerCase();
				if(haystack.indexOf(q) === -1) return false;
			}
			for(var i = 0; i < RARE_FILTER_FIELDS.length; i++){
				var f = RARE_FILTER_FIELDS[i];
				if(active[f.key] && (!it[f.key] || it[f.key].toLowerCase() !== active[f.key])) return false;
			}
			return true;
		});
		renderRareGrid(filtered);
	}

	async function loadRareItems(){
		if(rareLoaded) return;
		rareLoaded = true;
		try {
			var res = await fetch("/data/rare-items.json");
			allRareItems = res.ok ? await res.json() : [];
		} catch(e){
			allRareItems = [];
		}
		populateRareFilters();
		renderRareGrid(allRareItems);
	}

	document.getElementById("rareSearch").addEventListener("input", applyRareFilters);
	RARE_FILTER_FIELDS.forEach(function(f){
		document.getElementById(f.id).addEventListener("change", applyRareFilters);
	});
	document.getElementById("fRareReset").addEventListener("click", function(){
		document.getElementById("rareSearch").value = "";
		RARE_FILTER_FIELDS.forEach(function(f){ document.getElementById(f.id).value = ""; });
		applyRareFilters();
	});

	function switchTab(which){
		var isVanilla = which === "vanilla";
		document.getElementById("tabVanilla").classList.toggle("active", isVanilla);
		document.getElementById("tabRare").classList.toggle("active", !isVanilla);
		document.getElementById("vanillaPane").hidden = !isVanilla;
		document.getElementById("rarePane").hidden = isVanilla;
		if(!isVanilla) loadRareItems();
	}
	document.getElementById("tabVanilla").addEventListener("click", function(){ switchTab("vanilla"); });
	document.getElementById("tabRare").addEventListener("click", function(){ switchTab("rare"); });

	loadVanillaItems();
})();
</script>
