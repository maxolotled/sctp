<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
	:root{
		--bg:#101B14; --panel:#1B2A20; --panel-alt:#22332A; --line:#33453A;
		--muted:#8FA593; --text:#EAEFE7; --shell:#D9C89A; --shell-dim:#A99A73;
		--accent:#B7E23D; --accent-dim:#87AE29; --accent-ink:#16210F;
		--warn:#E2A33D; --info:#8C93E8; --radius:10px;
		--font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
	}
	*{box-sizing:border-box;}
	body{
		margin:0;
		background:radial-gradient(1200px 500px at 15% -10%, rgba(183,226,61,0.07), transparent 60%), var(--bg);
		color:var(--text);font-family:var(--font-body);line-height:1.5;
	}
	a{color:var(--accent);}
	.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

	header.site{border-bottom:1px solid var(--line);padding:24px 0;}
	.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
	.brand-row{display:flex;align-items:center;gap:12px;}
	.brand-mark{flex:0 0 auto;width:32px;height:32px;}
	.brand-mark path{fill:var(--accent);}
	.brand-row a{color:var(--text);font-family:var(--font-display);font-weight:600;font-size:19px;text-decoration:none;}
	.header-links{display:flex;align-items:center;gap:18px;}
	.header-links a{color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;}
	.header-links a:hover{color:var(--accent);}

	main{padding:36px 0 60px;}

	/* ---------- profile ---------- */
	.profile{
		display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;
		background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:26px;
	}
	.avatar{
		width:84px;height:84px;border-radius:14px;flex:0 0 auto;
		background:var(--panel-alt);border:1px solid var(--line);
		image-rendering:pixelated;
	}
	.profile-main{flex:1 1 320px;min-width:240px;}
	.profile-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
	.profile-name{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0;color:var(--text);}
	.world-badge{
		display:inline-block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
		padding:3px 10px;border-radius:999px;background:rgba(183,226,61,0.12);color:var(--accent);border:1px solid var(--accent-dim);
	}
	.other-world-link{font-size:13px;color:var(--muted);}
	.other-world-link a{color:var(--info);}
	.profile-bio{color:var(--text);font-size:14.5px;margin:10px 0 0;max-width:640px;white-space:pre-wrap;}
	.profile-shops{margin-top:14px;}
	.profile-shops .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
	.shop-pill{
		display:inline-block;background:var(--panel-alt);border:1px solid var(--line);border-radius:999px;
		padding:4px 12px;font-size:12.5px;color:var(--shell);margin:0 6px 6px 0;font-family:var(--font-mono);
	}
	.profile-stats{display:flex;gap:22px;flex-wrap:wrap;flex:0 0 auto;font-family:var(--font-mono);font-size:13px;color:var(--muted);}
	.profile-stats b{display:block;color:var(--shell);font-size:20px;font-weight:600;font-family:var(--font-display);}
	.add-info-btn{
		display:inline-block;margin-top:12px;background:transparent;color:var(--text);
		border:1px solid var(--line);font-family:var(--font-body);font-weight:600;font-size:13px;
		padding:8px 14px;border-radius:999px;text-decoration:none;cursor:pointer;
		transition:border-color .12s ease, color .12s ease;
	}
	.add-info-btn:hover{border-color:var(--accent-dim);color:var(--accent);}

	/* ---------- layout ---------- */
	.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;}
	@media (max-width:820px){.layout{grid-template-columns:1fr;}}

	.filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:16px;}
	@media (max-width:820px){.filters{position:static;}}
	.filters h2{font-family:var(--font-display);font-size:14px;font-weight:600;margin:0 0 12px;color:var(--shell);text-transform:uppercase;letter-spacing:.06em;}
	.f-group{margin-bottom:14px;}
	.f-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
	.f-group select, .f-group input[type=number], .f-group input[type=text]{
		width:100%;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:8px;padding:7px 9px;font-family:var(--font-body);font-size:13px;
	}
	.f-group select:focus, .f-group input:focus{outline:none;border-color:var(--accent-dim);}
	.f-range{display:flex;gap:6px;}
	.f-checkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);cursor:pointer;}
	.f-checkbox input{accent-color:var(--accent);cursor:pointer;}
	.f-reset{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:8px;font-size:12.5px;cursor:pointer;}
	.f-reset:hover{color:var(--text);border-color:var(--accent-dim);}

	.currency-checks{display:flex;flex-direction:column;gap:5px;}

	/* ---------- table (reuses index.html's conventions) ---------- */
	.table-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
	.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);}
	.table-toolbar .count{color:var(--muted);font-size:13px;}
	.world-filter{
		background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:8px;padding:7px 10px;font-family:var(--font-body);font-size:13px;cursor:pointer;
	}
	.world-filter:focus{outline:none;border-color:var(--accent-dim);}
	.scale-toggle{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:12.5px;color:var(--muted);}
	.scale-toggle .scale-btn{
		background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);
		border-radius:999px;padding:4px 12px;font-family:var(--font-body);font-size:12px;cursor:pointer;
	}
	.scale-toggle .scale-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
	.scale-toggle .scale-btn:not(.active):hover{border-color:var(--accent-dim);color:var(--text);}
	.table-scroll{overflow-x:auto;}
	table{width:100%;border-collapse:collapse;font-size:13.5px;}
	th{
		text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
		color:var(--muted);background:var(--panel-alt);border-bottom:1px solid var(--line);white-space:nowrap;
	}
	td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
	tr:last-child td{border-bottom:none;}
	.price-main{color:var(--shell);font-weight:600;}
	.price-sub{color:var(--muted);font-size:11.5px;}
	.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;}
	.badge.bulk{background:rgba(140,147,232,0.16);color:var(--info);}
	.badge.bundled{background:rgba(183,226,61,0.16);color:var(--accent);}
	.badge.mixed{background:rgba(226,163,61,0.16);color:var(--warn);margin-left:4px;}
	.badge.single{background:rgba(143,165,147,0.16);color:var(--muted);}
	.badge.display{background:rgba(217,200,154,0.16);color:var(--shell);}
	.position{font-family:var(--font-mono);color:var(--muted);font-size:12px;}
	.currency-cell{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:capitalize;}
	td.item-icon{padding-right:0;}
	td.item-icon img{width:24px;height:24px;image-rendering:pixelated;vertical-align:middle;display:block;}
	th[data-k]{cursor:pointer;}
	th[data-k]:hover{color:var(--text);}
	.pagination{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;color:var(--muted);font-size:13px;}
	.pagination button{
		background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		border-radius:8px;padding:6px 12px;cursor:pointer;
	}
	.pagination button:disabled{opacity:.4;cursor:not-allowed;}

	.info-icon{
		display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
		border-radius:50%;background:var(--info);color:var(--accent-ink);font-size:10px;font-weight:700;
		cursor:help;margin-left:6px;position:relative;vertical-align:middle;
	}
	.info-icon .tooltip{
		display:none;position:absolute;bottom:130%;left:0;
		background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
		padding:8px 10px;border-radius:8px;font-size:12px;font-weight:400;white-space:normal;
		width:200px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,0.35);
	}
	.info-icon:hover .tooltip, .info-icon:focus .tooltip{display:block;}
	/* Icons in the rightmost table columns (In stock / Last seen) would have
	   their tooltip clipped by .table-scroll's overflow-x — grow leftward
	   from the icon instead of rightward. */
	.info-icon.right .tooltip{left:auto;right:0;}

	.empty-state{padding:48px 24px;text-align:center;color:var(--muted);}
	.empty-state h3{font-family:var(--font-display);color:var(--text);font-size:18px;margin:0 0 6px;}

	footer.site{padding:20px 0 44px;color:var(--muted);font-size:12.5px;text-align:center;}

	/* ---------- item page ---------- */

<script>
(function(){
	"use strict";

	var API_BASE = "https://snailcraft-trading-post.snailcraft-trading-post.workers.dev";
	var DATA_URL = API_BASE + "/listings";
	var SHARED_SHOPS_URL = API_BASE + "/shared-shops";
	var ITEM_LANG_URL = "/data/item-lang-table.json";

	function esc(s){
		return String(s).replace(/[&<>"']/g, function(c){
			return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
		});
	}
	function fmtNum(n){ return Number(n).toLocaleString(); }

	// Shared by both the seller and item pages — a compact "Marketplace
	// listings" section for whichever marketplace-tagged rows (r.marketplace
	// === true, already merged into the same GET /listings both pages already
	// fetch) apply to this seller/item. Distinct from the main filterable
	// listings table on purpose, even though the same rows also appear mixed
	// into it — this is the dedicated place to look.
	function renderMarketplaceSection(rows){
		if(!rows.length) return "";
		var rowsHtml = rows.map(function(r){
			var typeLabel = r.marketplaceType === "lookingFor" ? "Looking for" : "Selling";
			var sellerLink = r.seller ? '<a href="/s/'+(r.world === "Honeybee" ? "hb" : "ff")+'/'+encodeURIComponent(r.seller)+'">'+esc(r.seller)+'</a>' : "";
			return '<tr><td><span class="badge '+(r.marketplaceType === "lookingFor" ? "mixed" : "bulk")+'">'+esc(typeLabel)+'</span></td>'+
				'<td>'+esc(r.itemNameDisplay || r.itemName)+'</td>'+
				'<td>'+fmtNum(r.amount)+'</td>'+
				'<td>'+esc(r.priceLabel)+'</td>'+
				'<td>'+esc(r.world)+'</td>'+
				'<td>'+sellerLink+'</td></tr>';
		}).join("");
		return '<section class="table-card" style="margin-bottom:20px;">'+
			'<div class="table-toolbar"><span class="count">Marketplace listings ('+fmtNum(rows.length)+')</span></div>'+
			'<div class="table-scroll"><table><thead><tr><th>Type</th><th>Item</th><th>Qty</th><th>Price</th><th>World</th><th>Poster</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
		'</section>';
	}
	// Graphs store price in diamonds/item (same basis as priceInDiamonds
	// below); above 9 that reads more naturally as diamond blocks (9 dia = 1
	// DB) than as a big raw diamond count.
	function formatDiaOrDb(v){
		if(v === null || v === undefined || isNaN(v)) return v;
		var n = Math.round(v*100)/100;
		return n > 9 ? (Math.round((n/9)*100)/100) + " DB" : n + " dia";
	}
	function alphaOnly(s){ return String(s||"").toLowerCase().replace(/[^a-z]/g, ""); }

	// ---------------- rare item name matching ----------------
	// Rare items have no baseItem worth matching on (many share a generic
	// vanilla item id), so listings are matched purely by display name.
	// Aggressive normalization (case/punctuation/accents/decorative symbols
	// all stripped) covers the overwhelming majority of real-world "typos" —
	// shop signs wrapped in borders like "⋆✳ 1st Birthday Cake ✳⋆" normalize
	// down to an exact match. True edit-distance fuzzing (tolerating actual
	// misspelled letters) was tried and dropped: tested against live listings
	// it produced real false positives, since this catalog has many
	// intentionally similar but distinct items ("Cow Plushie" vs "Cod Plushie"
	// vs "Crow Plushie", "Amethyst Sword" vs "Amethyst Shard", the Pride Duck
	// set) that land in the same similarity range as genuine typo fixes —
	// no threshold cleanly separates the two.
	function rareNormalize(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9']/g, ""); }
	function isRareNameMatch(a, b){
		var na = rareNormalize(a), nb = rareNormalize(b);
		return !!na && na === nb;
	}
	// Merges several /items/history result arrays (one per distinct
	// baseItem+name pair currently matched to a rare item) into one series —
	// needed because the backend still keys history by exact (baseItem, name),
	// not by the fuzzy-matched rare item, so a typo'd listing's history lives
	// under its own separate key.
	function mergeHistoryArrays(arrays){
		var byKey = {}, order = [];
		arrays.forEach(function(arr){
			arr.forEach(function(h){
				var k = h.date + "|" + h.world;
				var g = byKey[k];
				if(!g){
					g = { date: h.date, world: h.world, avgPrice: 0, lowestPrice: h.lowestPrice, highestPrice: h.highestPrice, listingCount: 0, sellerCount: 0, totalStock: 0, _weighted: 0 };
					byKey[k] = g;
					order.push(k);
				}
				g._weighted += h.avgPrice * h.listingCount;
				g.listingCount += h.listingCount;
				g.lowestPrice = Math.min(g.lowestPrice, h.lowestPrice);
				g.highestPrice = Math.max(g.highestPrice, h.highestPrice);
				g.sellerCount = Math.max(g.sellerCount, h.sellerCount);
				g.totalStock += h.totalStock;
			});
		});
		return order.map(function(k){
			var g = byKey[k];
			g.avgPrice = g.listingCount > 0 ? g._weighted / g.listingCount : 0;
			delete g._weighted;
			return g;
		});
	}
	// Manually-added listings (admin.html) store an "M001"-style id in
	// lastSeen instead of a real scan timestamp.
	function isManualListing(r){
		return /^M\d+$/.test(String(r.lastSeen||""));
	}
	function manualIcon(text){
		// "right" — these are only ever used in the In stock / Last seen
		// columns, which sit at the right edge of the scrollable table.
		return '<span class="info-icon right" tabindex="0">i<span class="tooltip">'+esc(text)+'</span></span>';
	}
	// Shared by relTime()'s 30-day-plus fallback and availableSinceCell() below
	// — one absolute-date format everywhere on the site, unambiguous regardless
	// of the viewer's locale (unlike a bare toLocaleDateString(), which can read
	// as either D/M or M/D depending on where you are).
	var MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
	function shortDate(d){
		return d.getUTCDate()+" "+MONTH_ABBR[d.getUTCMonth()]+" '"+String(d.getUTCFullYear()).slice(2);
	}
	function relTime(iso){
		var t = Date.parse(iso);
		// Manually-added listings store an "M001"-style id here instead of a
		// real timestamp — show it as-is rather than a meaningless dash.
		if(isNaN(t)) return iso || "—";
		var d = Math.floor((Date.now() - t) / 60000);
		if(d < 1) return "just now";
		if(d < 60) return d+"m ago";
		var h = Math.floor(d/60);
		if(h < 24) return h+"h ago";
		var days = Math.floor(h/24);
		if(days < 30) return days+"d ago";
		return shortDate(new Date(t));
	}
	// Rows from before availableSince existed have no real first-seen date —
	// show the date this tracking started instead of a blank cell, same
	// fallback convention as the homepage.
	var AVAILABLE_SINCE_FALLBACK = new Date(Date.UTC(2026, 7, 30));
	function availableSinceCell(r){
		var d = r.availableSince ? new Date(r.availableSince) : null;
		if(!d || isNaN(d.getTime())) d = AVAILABLE_SINCE_FALLBACK;
		return shortDate(d);
	}

	// Real player-market rates: 64 iron = 1 diamond, 18 gold = 1 diamond, 1
	// netherite ingot = 18 diamonds — block variants use the standard 9-per-block
	// crafting ratio. Same table as index.html's CURRENCY_VALUE.
	var CURRENCY_VALUE = {
		diamond: 1, diamondblock: 9,
		iron: 1/64, ironingot: 1/64, ironblock: 9/64,
		gold: 1/18, goldingot: 1/18, goldblock: 9/18,
		netherite: 18, netheriteingot: 18, netheriteblock: 162
	};
	function priceInDiamonds(r){
		if(String(r.currency||"").toLowerCase() === "display") return Infinity;
		var mult = CURRENCY_VALUE[String(r.currency||"").toLowerCase()];
		return r.price * (mult || 1);
	}
	function pricePerItem(r){ return priceInDiamonds(r) / (r.stackSize || 1); }

	// ---------------- shared: non-English name normalization ----------------
	// Used by both the seller page and the item page — hoisted out of either
	// so both can share one cached fetch of item-lang-table.json.
	var itemLangIndex = {};

	function localizedNameToEnglish(baseItem, itemName){
		var entry = itemLangIndex[baseItem];
		if(!entry) return itemName;
		if(entry.altSet.has(alphaOnly(itemName))) return entry.en;
		return itemName;
	}

	async function loadItemLangTable(){
		try {
			var res = await fetch(ITEM_LANG_URL + "?t=" + Date.now());
			if(!res.ok) return;
			var raw = await res.json();
			var next = {};
			Object.keys(raw).forEach(function(id){
				next[id] = { en: raw[id].en, altSet: new Set(raw[id].alt) };
			});
			itemLangIndex = next;
		} catch(e){}
	}

	function normalizeRow(raw){
		var stackSize = Number(raw.stackSize) || 64;
		var amount = Number(raw.amount) || 0;
		return {
			itemName: String(raw.itemName||""),
			baseItem: String(raw.baseItem||"—"),
			bulk: raw.bulk === true,
			bundled: raw.bundled === true,
			mixedContents: raw.mixedContents === true,
			price: Number(raw.price) || 0,
			priceLabel: String(raw.priceLabel||""),
			stackSize: stackSize,
			amount: amount,
			stacksInStock: raw.stacksInStock !== undefined ? Number(raw.stacksInStock) : Math.round((amount/stackSize)*100)/100,
			currency: String(raw.currency||"unknown"),
			seller: String(raw.seller||""),
			world: String(raw.world||""),
			position: String(raw.position||""),
			lastSeen: String(raw.lastSeen||""),
			availableSince: String(raw.availableSince||""),
			// Marketplace posts (selling/lookingFor) are merged into GET
			// /listings tagged this way — see worker.js's handleGetListings.
			// Not stripping these is why renderMarketplaceSection can tell
			// them apart from real shop listings sharing the same array.
			marketplace: raw.marketplace === true,
			marketplaceType: raw.marketplaceType || null,
			marketplaceListingId: raw.marketplaceListingId || null
		};
	}

	// ---------------- shared: thumbnails + item-page links ----------------
	// Same maps/lookup convention as the homepage (index.html) — populated
	// once by loadTextureCatalogs(), used by both the seller page and the
	// item page's own listings table.
	var textureByName = {}, textureByBaseItem = {}, slugByName = {}, slugByBaseItem = {};
	var PLACEHOLDER_ICON = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2322332A'/><path d='M4 4 L12 12 M12 4 L4 12' stroke='%2333453A' stroke-width='1.5'/></svg>";
	var PLACEHOLDER_ICON_JS = PLACEHOLDER_ICON.replace(/'/g, "\\'");
	function iconFor(r){
		var tex = textureByName[alphaOnly(r.itemNameDisplay || r.itemName)];
		if(!tex) tex = textureByBaseItem[String(r.baseItem||"").trim().toLowerCase()];
		return tex || PLACEHOLDER_ICON;
	}
	function itemLibraryUrlFor(r){
		// Every enchanted book shares one catalog entry — link straight to its
		// own specific-form page (?name=...) instead of the generic one, since
		// that's the only URL that actually carries which book this row is.
		if(String(r.baseItem||"").trim().toLowerCase() === "minecraft:enchanted_book"){
			var name = r.itemNameDisplay || r.itemName;
			return name ? "/items/enchanted_book?name=" + encodeURIComponent(name) : null;
		}
		var slug = slugByName[alphaOnly(r.itemNameDisplay || r.itemName)];
		if(!slug) slug = slugByBaseItem[String(r.baseItem||"").trim().toLowerCase()];
		return slug ? "/items/" + encodeURIComponent(slug) : null;
	}
	async function loadTextureCatalogs(onLoaded){
		try {
			var results = await Promise.all([fetch("/data/vanilla-items.json"), fetch("/data/rare-items.json")]);
			var vanilla = results[0].ok ? await results[0].json() : [];
			var rare = results[1].ok ? await results[1].json() : [];
			vanilla.forEach(function(it){
				if(!it.name || !it.texture || !it.id) return;
				var nameKey = alphaOnly(it.name);
				if(nameKey && !textureByName[nameKey]){ textureByName[nameKey] = it.texture; slugByName[nameKey] = it.id; }
				var baseKey = String(it.baseItem||"").toLowerCase();
				if(baseKey && !textureByBaseItem[baseKey]){ textureByBaseItem[baseKey] = it.texture; slugByBaseItem[baseKey] = it.id; }
			});
			rare.forEach(function(it){
				if(!it.name || !it.texture || !it.id) return;
				var nameKey = alphaOnly(it.name);
				if(nameKey){ textureByName[nameKey] = it.texture; slugByName[nameKey] = it.id; }
			});
			if(onLoaded) onLoaded();
		} catch(e){ /* rows just fall back to the placeholder icon */ }
	}

	// ---------------- shared: paginated + sortable table shell ----------------
	// Same system as the homepage: 50 rows/page, prev/next controls, click a
	// <th data-k="..."> to sort by it. Pure rendering + callbacks — each
	// caller owns its own page-number/sort-key state and just re-invokes this
	// after updating it. Returns the (possibly clamped) page number actually
	// rendered, so the caller's own state stays in sync.
	var PAGE_SIZE = 50;
	function renderPaginatedRows(area, pag, rows, page, headerHtml, buildRow, onPageChange, onSortClick){
		var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
		if(page > totalPages) page = totalPages;
		if(page < 1) page = 1;
		var start = (page-1)*PAGE_SIZE;
		var pageRows = rows.slice(start, start+PAGE_SIZE);
		area.innerHTML = '<div class="table-scroll"><table><thead><tr>'+headerHtml+'</tr></thead><tbody>'+pageRows.map(buildRow).join("")+'</tbody></table></div>';

		area.querySelectorAll("thead th[data-k]").forEach(function(th){
			th.addEventListener("click", function(){ onSortClick(th.getAttribute("data-k")); });
		});

		if(rows.length <= PAGE_SIZE){
			pag.style.display = "none";
			return page;
		}
		pag.style.display = "flex";
		pag.innerHTML = '<button type="button" id="prevPageBtn"'+(page<=1?' disabled':'')+'>&larr; Prev</button>'+
			'<span>Page '+page+' of '+totalPages+'</span>'+
			'<button type="button" id="nextPageBtn"'+(page>=totalPages?' disabled':'')+'>Next &rarr;</button>';
		document.getElementById("prevPageBtn").addEventListener("click", function(){ onPageChange(page-1); });
		document.getElementById("nextPageBtn").addEventListener("click", function(){ onPageChange(page+1); });
		return page;
	}
	// Generic ascending/descending comparator used by both pages' sortKey
	// handling — mirrors the homepage's per-column sort semantics (price/stock
	// low-high by default, text columns A-Z, recency newest-first).
	function compareListingsBy(key, a, b){
		switch(key){
			case "price-asc": return pricePerItem(a) - pricePerItem(b);
			case "price-desc": return pricePerItem(b) - pricePerItem(a);
			case "stock-asc": return a.amount - b.amount;
			case "stock-desc": return b.amount - a.amount;
			case "item-az": return (a.itemNameDisplay||a.itemName).localeCompare(b.itemNameDisplay||b.itemName);
			case "seller-az": return String(a.seller).localeCompare(String(b.seller));
			case "recent":
			default:
				var ta = Date.parse(a.lastSeen), tb = Date.parse(b.lastSeen);
				return (isNaN(tb)?0:tb) - (isNaN(ta)?0:ta);
		}
	}

	// ---------------- routing ----------------
	var sellerMatch = /^\/s\/(hb|ff)\/([^\/]+)\/?$/i.exec(window.location.pathname);
	var itemMatch = /^\/items\/([^\/]+)\/?$/i.exec(window.location.pathname);

	if(sellerMatch){
		runSellerPage(sellerMatch[1], sellerMatch[2]);
	} else if(itemMatch){
		// Enchanted books all share one catalog entry (baseItem, not a real
		// per-enchantment id) — a specific form's own page is reached via
		// ?name=..., not a distinct slug. See runItemPage.
		var exactName = new URLSearchParams(window.location.search).get("name");
		runItemPage(decodeURIComponent(itemMatch[1]), exactName);
	} else {
		document.getElementById("app").innerHTML =
			'<div class="notfound"><h1>Page not found</h1>'+
			'<p>That address doesn\'t point at anything here.</p>'+
			'<p><a href="/index.html">&larr; Back to the Trading Post</a></p></div>';
	}

	// ================= seller page =================
	function runSellerPage(worldSlugRaw, usernameRaw){
	var worldSlug = worldSlugRaw.toLowerCase();
	var world = worldSlug === "hb" ? "Honeybee" : "Firefly";
	var otherSlug = worldSlug === "hb" ? "ff" : "hb";
	var otherWorld = worldSlug === "hb" ? "Firefly" : "Honeybee";
	var username = decodeURIComponent(usernameRaw);
	var usernameKey = username.toLowerCase();

	document.title = username + " (" + world + ") — SC Trading Post";

	// ---------------- state ----------------
	var allListings = [];   // this seller + this world only
	var filtered = [];
	var hasOtherWorldListings = false;
	var currencyFilters = {};
	var activeSort = "recent";
	var page = 1;

	async function loadAll(){
		var listingsRaw = [], approved = [];
		try {
			var res = await fetch(DATA_URL);
			listingsRaw = res.ok ? await res.json() : [];
		} catch(e){ listingsRaw = []; }

		try {
			var res2 = await fetch(SHARED_SHOPS_URL);
			approved = res2.ok ? await res2.json() : [];
		} catch(e){ approved = []; }

		await loadItemLangTable();
		loadTextureCatalogs(renderTable); // fires off in parallel — re-renders once icons/links are ready, doesn't block the first render

		var mine = listingsRaw.filter(function(r){ return String(r.seller||"").toLowerCase() === usernameKey; });
		allListings = mine.filter(function(r){ return r.world === world; }).map(normalizeRow);
		allListings.forEach(function(r){ r.itemNameDisplay = localizedNameToEnglish(r.baseItem, r.itemName); });
		hasOtherWorldListings = mine.some(function(r){ return r.world === otherWorld; });

		var profile = approved.filter(function(e){ return String(e.username||"").toLowerCase() === usernameKey; })[0] || null;

		renderProfile(profile);
		document.getElementById("app").insertAdjacentHTML("beforeend", renderMarketplaceSection(allListings.filter(function(r){ return r.marketplace; })));
		populateCurrencyOptions();
		renderApp();
		applyFilters();
	}

	// ---------------- profile header ----------------
	function renderProfile(profile){
		var shops = profile && Array.isArray(profile.shops) ? profile.shops : [];
		var bio = profile && profile.bio ? profile.bio : "";
		var hasAnyInfo = !!bio || shops.length > 0;
		var distinctItems = new Set(allListings.map(function(r){ return r.baseItem; })).size;
		var priced = allListings.filter(function(r){ return String(r.currency).toLowerCase() !== "display"; });
		var avg = priced.length
			? priced.reduce(function(a,r){ return a + pricePerItem(r); }, 0) / priced.length
			: null;

		var html = '<div class="profile">'+
			'<img class="avatar" src="https://mc-heads.net/avatar/'+encodeURIComponent(username)+'/168" alt="" width="84" height="84">'+
			'<div class="profile-main">'+
				'<div class="profile-top">'+
					'<h1 class="profile-name">'+esc(username)+'</h1>'+
					'<span class="world-badge">'+esc(world)+'</span>'+
					(hasOtherWorldListings ? '<span class="other-world-link">also sells on <a href="/s/'+otherSlug+'/'+encodeURIComponent(username)+'">'+esc(otherWorld)+'</a></span>' : '')+
				'</div>'+
				(bio ? '<p class="profile-bio">'+esc(bio)+'</p>' : '')+
				(shops.length ? '<div class="profile-shops"><div class="label">Also sells at</div>'+shops.map(function(s){ return '<span class="shop-pill">'+esc(s)+'</span>'; }).join("")+'</div>' : '')+
				(hasAnyInfo ? '' : '<a class="add-info-btn" href="/index.html?addShop='+encodeURIComponent(username)+'">+ Add your shop info</a>')+
			'</div>'+
			'<div class="profile-stats">'+
				'<div><b>'+fmtNum(allListings.length)+'</b>listings</div>'+
				'<div><b>'+fmtNum(distinctItems)+'</b>distinct items</div>'+
				'<div><b>'+(avg === null ? '—' : fmtNum(Math.round(avg*100)/100))+'</b>avg dia / item</div>'+
			'</div>'+
		'</div>';

	// ---------------- currency filter ----------------
	function currencyLabel(c){
		if(c === "diamond") return "Diamond";
		if(c === "diamondblock") return "Diamond block";
		return c.charAt(0).toUpperCase() + c.slice(1);
	}
	function populateCurrencyOptions(){
		var found = {};
		allListings.forEach(function(r){
			var c = String(r.currency||"").toLowerCase();
			if(c && c !== "display") found[c] = true;
		});
		Object.keys(found).sort().forEach(function(c){ currencyFilters[c] = true; });
	}

	// ---------------- shell + filters ----------------
	function renderApp(){
		var currencyChecks = Object.keys(currencyFilters).sort().map(function(c){
			return '<label class="f-checkbox"><input type="checkbox" class="f-currency" data-c="'+esc(c)+'" checked> '+esc(currencyLabel(c))+'</label>';
		}).join("");

		var html = '<div class="layout">'+
			'<aside class="filters">'+
				'<h2>Filters</h2>'+
				'<div class="f-group"><label for="fSearch">Search their items</label><input type="text" id="fSearch" placeholder="e.g. diamond sword"></div>'+
				'<div class="f-group"><label for="fBulk">Listing type</label><select id="fBulk">'+
					'<option value="">All listings</option><option value="bulk">Bulk (shulker) only</option>'+
					'<option value="bundled">Bundled only</option>'+
					'<option value="single">Non-bulk only</option><option value="nonstacked">Non-stacked items only</option>'+
				'</select></div>'+
				'<div class="f-group"><label class="f-checkbox"><input type="checkbox" id="fHideDisplay"> Hide display-only listings</label></div>'+
				(currencyChecks ? '<div class="f-group"><label>Currency</label><div class="currency-checks">'+currencyChecks+'</div></div>' : '')+
				'<div class="f-group"><label>Price (in diamonds)</label><div class="f-range">'+
					'<input type="number" id="fPriceMin" placeholder="min" min="0"><input type="number" id="fPriceMax" placeholder="max" min="0">'+
				'</div></div>'+
				'<div class="f-group"><label for="fMinStock">Minimum in stock</label><input type="number" id="fMinStock" placeholder="e.g. 64" min="0"></div>'+
				'<div class="f-group"><label for="fSort">Sort by</label><select id="fSort">'+
					'<option value="recent">Most recently updated</option>'+
					'<option value="price-asc">Price ↑ (cheapest per item)</option>'+
					'<option value="price-desc">Price ↓ (priciest per item)</option>'+
					'<option value="stock-asc">Stock ↑</option>'+
					'<option value="stock-desc">Stock ↓</option>'+
					'<option value="item-az">Item name A→Z</option>'+
				'</select></div>'+
				'<button class="f-reset" id="fReset" type="button">Reset all filters</button>'+
			'</aside>'+
			'<section class="table-card">'+
				'<div class="table-toolbar"><span class="count" id="resultCount"></span></div>'+
				'<div id="tableArea"></div>'+
				'<div class="pagination" id="pagination" style="display:none;"></div>'+
			'</section>'+
		'</div>';
		document.getElementById("app").insertAdjacentHTML("beforeend", html);

		["fSearch","fBulk","fHideDisplay","fPriceMin","fPriceMax","fMinStock","fSort"].forEach(function(id){
			var el = document.getElementById(id);
			el.addEventListener("input", applyFilters);
			el.addEventListener("change", applyFilters);
		});
		document.querySelectorAll(".f-currency").forEach(function(cb){
			cb.addEventListener("change", function(){
				currencyFilters[cb.getAttribute("data-c")] = cb.checked;
				applyFilters();
			});
		});
		document.getElementById("fReset").addEventListener("click", function(){
			document.getElementById("fSearch").value = "";
			document.getElementById("fBulk").value = "";
			document.getElementById("fHideDisplay").checked = false;
			document.getElementById("fPriceMin").value = "";
			document.getElementById("fPriceMax").value = "";
			document.getElementById("fMinStock").value = "";
			document.getElementById("fSort").value = "recent";
			document.querySelectorAll(".f-currency").forEach(function(cb){ cb.checked = true; currencyFilters[cb.getAttribute("data-c")] = true; });
			applyFilters();
		});
	}

	// ---------------- filtering + sorting ----------------
	function applyFilters(){
		var q = document.getElementById("fSearch").value.trim().toLowerCase();
		var bulkMode = document.getElementById("fBulk").value;
		var hideDisplay = document.getElementById("fHideDisplay").checked;
		var priceMin = document.getElementById("fPriceMin").value;
		var priceMax = document.getElementById("fPriceMax").value;
		var minStock = document.getElementById("fMinStock").value;
		activeSort = document.getElementById("fSort").value;

		filtered = allListings.filter(function(r){
			if(q && r.itemNameDisplay.toLowerCase().indexOf(q) === -1 && r.baseItem.toLowerCase().indexOf(q) === -1) return false;
			if(bulkMode === "bulk" && !r.bulk) return false;
			if(bulkMode === "bundled" && !r.bundled) return false;
			if(bulkMode === "single" && r.bulk) return false;
			// "Non-stacked" means the ITEM itself doesn't stack to 64 (tools,
			// armor, ...) — a bulk listing's stackSize is scaled by 27 (one whole
			// shulker), so undo that first rather than comparing it directly.
			if(bulkMode === "nonstacked" && (r.bulk ? r.stackSize / 27 : r.stackSize) === 64) return false;
			var currency = String(r.currency||"").toLowerCase();
			if(hideDisplay && currency === "display") return false;
			if(currency !== "display" && currencyFilters.hasOwnProperty(currency) && !currencyFilters[currency]) return false;
			if(priceMin !== "" && priceInDiamonds(r) < parseFloat(priceMin)) return false;
			if(priceMax !== "" && priceInDiamonds(r) > parseFloat(priceMax)) return false;
			if(minStock !== "" && r.amount < parseFloat(minStock)) return false;
			return true;
		});

		filtered.sort(function(a,b){ return compareListingsBy(activeSort, a, b); });
		page = 1;
		renderTable();
	}

	// Clicking a sortable column header does the same thing the "Sort by"
	// dropdown does — kept in sync both ways so either control reflects the
	// other.
	function setSort(key){
		activeSort = key;
		document.getElementById("fSort").value = key;
		filtered.sort(function(a,b){ return compareListingsBy(activeSort, a, b); });
		page = 1;
		renderTable();
	}

	// ---------------- table ----------------
	function renderTable(){
		document.getElementById("resultCount").textContent = fmtNum(filtered.length)+" listing"+(filtered.length===1?"":"s");
		var area = document.getElementById("tableArea");
		var pag = document.getElementById("pagination");

		if(filtered.length === 0){
			pag.style.display = "none";
			area.innerHTML = allListings.length === 0
				? '<div class="empty-state"><h3>No listings found</h3><p>'+esc(username)+' doesn\'t have any current listings on '+esc(world)+'.</p></div>'
				: '<div class="empty-state"><h3>No listings match those filters</h3><p>Try widening your price range or clearing the search.</p></div>';
			return;
		}

		var headerHtml =
			'<th></th>'+
			'<th data-k="item-az">Item</th>'+
			'<th>Base item</th><th>Type</th><th>Currency</th>'+
			'<th data-k="price-asc">Price</th>'+
			'<th data-k="stock-desc">In stock</th>'+
			'<th>Position</th>'+
			'<th data-k="recent">Last seen</th>'+
			'<th>Available since</th>';

		function buildRow(r){
			var manual = isManualListing(r);
			var stockCell = manual
				? '&infin;'+manualIcon("Added manually by an admin — stock isn't tracked for this listing.")
				: fmtNum(r.amount)+'<br><span class="price-sub">'+r.stacksInStock+' '+(r.bulk ? 'shulks' : r.stackSize === 64 ? 'stacks' : 'groups')+'</span>';
			var lastSeenCell = manual
				? 'None ('+esc(r.lastSeen)+')'+manualIcon("Added manually by an admin — there's no real scan time for this listing.")
				: relTime(r.lastSeen);
			var itemUrl = itemLibraryUrlFor(r);
			var itemNameHtml = itemUrl ? '<a href="'+esc(itemUrl)+'">'+esc(r.itemNameDisplay)+'</a>' : esc(r.itemNameDisplay);
			return '<tr>'+
				'<td class="item-icon"><img src="'+esc(iconFor(r))+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+PLACEHOLDER_ICON_JS+'\';"></td>'+
				'<td>'+itemNameHtml+'</td>'+
				'<td class="position">'+esc(r.baseItem)+'</td>'+
				'<td>'+
					(String(r.currency).toLowerCase() === "display" ? '<span class="badge display">Display</span>' : (r.bulk ? '<span class="badge bulk">Bulk</span>' : r.bundled ? '<span class="badge bundled">Bundled</span>' : '<span class="badge single">Single</span>'))+
					(r.mixedContents ? ' <span class="badge mixed">Mixed chest</span>' : '')+
				'</td>'+
				'<td class="currency-cell">'+esc(r.currency)+'</td>'+
				'<td><span class="price-main">'+esc(r.priceLabel)+'</span><br><span class="price-sub">per '+(r.bulk ? 'shulk' : r.stackSize)+'</span></td>'+
				'<td>'+stockCell+'</td>'+
				'<td class="position">'+esc(r.position)+'</td>'+
				'<td>'+lastSeenCell+'</td>'+
				'<td>'+availableSinceCell(r)+'</td>'+
				'</tr>';
		}

		page = renderPaginatedRows(area, pag, filtered, page, headerHtml, buildRow,
			function onPageChange(p){ page = p; renderTable(); },
			function onSortClick(key){ setSort(key); });
	}

	loadAll();
	}

	// ================= item page =================
	function runItemPage(slug, exactName){
		document.title = "Item — SC Trading Post";

		var catalogEntry = null;
		var isRare = false;
		var isEnchantedBookDirectory = false; // the generic /items/enchanted_book page with no ?name= — see loadItem
		var itemKey = null;
		var currentListings = []; // both worlds, normalized
		var worldFilter = ""; // "" = both, else "Firefly" or "Honeybee"
		// Vanilla items are usually traded by the stack, so their price charts
		// read more naturally per stack of 64 than per single item (rare items
		// are almost always sold individually, so they default to per-item) —
		// the toggle below lets a visitor flip either chart type either way.
		var priceScale = null; // set from isRare once catalogEntry is known, see loadItem
		var lastHistory = [];
		var priceCharts = {}; // canvas id -> live Chart instance, so toggling can destroy+recreate cleanly

		function sellerUrlFor(r){
			var s = r.world === "Honeybee" ? "hb" : r.world === "Firefly" ? "ff" : "";
			return s ? "/s/" + s + "/" + encodeURIComponent(r.seller) : "";
		}

		function rareInfoHtml(entry){
			var fields = [
				{ label: "Category", value: entry.category },
				{ label: "Effect", value: entry.effect },
				{ label: "Release date", value: entry.releaseDate },
				{ label: "Obtained from", value: entry.obtainedFrom },
				{ label: "Glow/Particles", value: entry.glowParticles },
				{ label: "Type/Slot", value: entry.typeSlot },
				{ label: "Dyeable", value: entry.dyeable },
			].filter(function(f){ return f.value; });
			if(fields.length === 0) return "";
			return '<div class="rare-info">' + fields.map(function(f){
				return '<div class="f"><span class="f-label">'+esc(f.label)+'</span><span class="f-value">'+esc(f.value)+'</span></div>';
			}).join("") + '</div>';
		}

		function renderSkeleton(entry){
			var subtitle = isRare ? esc(entry.category) : esc(entry.baseItem);
			var html = '<div class="item-header">'+
					'<img src="'+esc(entry.texture)+'" class="item-header-icon" alt="" onerror="this.style.visibility=\'hidden\'">'+
					'<div><h1 class="item-header-name">'+esc(entry.name)+'</h1>'+
					'<p class="tag">'+subtitle+' &middot; <a href="/items/">&larr; Item Library</a></p></div>'+
				'</div>'+
				(isRare ? rareInfoHtml(entry) : '')+
				'<p class="history-note" id="historyNote"></p>'+
				'<div class="scale-toggle">Price charts:'+
					'<button type="button" class="scale-btn" id="scalePer1" data-scale="1">Per item</button>'+
					'<button type="button" class="scale-btn" id="scalePer64" data-scale="64">Per stack of 64</button>'+
				'</div>'+
				'<div class="charts-grid">'+
					'<div class="chart-card"><h3>Average price (<span id="avgPriceUnit"></span>)</h3><div class="chart-wrap"><canvas id="chartAvgPrice"></canvas></div></div>'+
					'<div class="chart-card"><h3>Lowest price (<span id="lowestPriceUnit"></span>)</h3><div class="chart-wrap"><canvas id="chartLowestPrice"></canvas></div></div>'+
					'<div class="chart-card"><h3>Distinct sellers</h3><div class="chart-wrap"><canvas id="chartSellers"></canvas></div></div>'+
					'<div class="chart-card"><h3>Total stock</h3><div class="chart-wrap"><canvas id="chartStock"></canvas></div></div>'+
				'</div>'+
				'<section class="table-card">'+
					'<div class="table-toolbar"><span class="count" id="itemResultCount"></span>'+
						'<select id="itemWorldFilter" class="world-filter">'+
							'<option value="">All worlds</option>'+
							'<option value="Firefly">Firefly</option>'+
							'<option value="Honeybee">Honeybee</option>'+
						'</select>'+
					'</div>'+
					'<div id="itemTableArea"></div>'+
					'<div class="pagination" id="itemPagination" style="display:none;"></div>'+
				'</section>';
			document.getElementById("app").insertAdjacentHTML("beforeend", html);
			document.getElementById("itemWorldFilter").addEventListener("change", function(){
				worldFilter = this.value;
				renderItemTable();
			});
			document.getElementById("scalePer1").addEventListener("click", function(){ setPriceScale(1); });
			document.getElementById("scalePer64").addEventListener("click", function(){ setPriceScale(64); });
		}

		function setPriceScale(scale){
			if(priceScale === scale) return;
			priceScale = scale;
			renderGraphs(lastHistory);
		}

		function renderGraphs(history){
			lastHistory = history;

			// Vanilla items are usually traded by the stack, so their price
			// charts read more naturally per stack of 64 than per single item
			// (rare items are almost always sold individually, so they default
			// to the raw per-item basis computeDailySnapshots() stores) — only
			// picked once, on the first render; the toggle button owns it after that.
			if(priceScale === null) priceScale = isRare ? 1 : 64;
			document.getElementById("scalePer1").classList.toggle("active", priceScale === 1);
			document.getElementById("scalePer64").classList.toggle("active", priceScale === 64);
			var unitText = priceScale === 1 ? "dia or DB/item" : "dia or DB/stack of 64";
			document.getElementById("avgPriceUnit").textContent = unitText;
			document.getElementById("lowestPriceUnit").textContent = unitText;

			var note = document.getElementById("historyNote");
			note.textContent = history.length === 0
				? "No price history yet — a snapshot is taken once daily, so check back after tomorrow's snapshot."
				: "";

			var dates = [];
			var seen = {};
			history.forEach(function(h){ if(!seen[h.date]){ seen[h.date] = true; dates.push(h.date); } });
			dates.sort();

			function seriesFor(world, field, scale){
				var byDate = {};
				history.forEach(function(h){ if(h.world === world) byDate[h.date] = h[field]; });
				return dates.map(function(d){
					if(!byDate.hasOwnProperty(d)) return null;
					var v = byDate[d];
					return v === null || v === undefined ? v : v * (scale || 1);
				});
			}

			[
				{ id: "chartAvgPrice", field: "avgPrice", isPrice: true },
				{ id: "chartLowestPrice", field: "lowestPrice", isPrice: true },
				{ id: "chartSellers", field: "sellerCount" },
				{ id: "chartStock", field: "totalStock" },
			].forEach(function(cfg){
				var yTicks = { color: "#8FA593" };
				var plugins = { legend: { labels: { color: "#EAEFE7" } } };
				if(cfg.isPrice){
					yTicks.callback = function(value){ return formatDiaOrDb(value); };
					plugins.tooltip = { callbacks: { label: function(ctx){
						return ctx.dataset.label + ": " + formatDiaOrDb(ctx.parsed.y);
					} } };
				}
				// Re-rendered on every toggle click (not just page load) — destroy
				// whatever's already on this canvas first, or Chart.js throws
				// "Canvas is already in use" on the second render.
				if(priceCharts[cfg.id]) priceCharts[cfg.id].destroy();
				priceCharts[cfg.id] = new Chart(document.getElementById(cfg.id).getContext("2d"), {
					type: "line",
					data: {
						labels: dates,
						datasets: [
							{ label: "Firefly", data: seriesFor("Firefly", cfg.field, cfg.isPrice ? priceScale : 1), borderColor: "#E2A33D", backgroundColor: "rgba(226,163,61,0.12)", tension: 0.25, spanGaps: true },
							{ label: "Honeybee", data: seriesFor("Honeybee", cfg.field, cfg.isPrice ? priceScale : 1), borderColor: "#B7E23D", backgroundColor: "rgba(183,226,61,0.12)", tension: 0.25, spanGaps: true },
						]
					},
					options: {
						responsive: true,
						interaction: { mode: "index", intersect: false },
						scales: {
							x: { ticks: { color: "#8FA593", maxRotation: 0 }, grid: { color: "#233128" } },
							y: { ticks: yTicks, grid: { color: "#233128" }, beginAtZero: true }
						},
						plugins: plugins
					}
				});
			});
		}

		var itemPage = 1;
		var itemSort = "recent";

		function renderItemTable(){
			var area = document.getElementById("itemTableArea");
			var pag = document.getElementById("itemPagination");
			var rows = worldFilter ? currentListings.filter(function(r){ return r.world === worldFilter; }) : currentListings;
			rows = rows.slice().sort(function(a,b){ return compareListingsBy(itemSort, a, b); });
			document.getElementById("itemResultCount").textContent = fmtNum(rows.length) + " current listing" + (rows.length===1?"":"s");
			if(rows.length === 0){
				pag.style.display = "none";
				area.innerHTML = currentListings.length === 0
					? '<div class="empty-state"><h3>No current listings</h3><p>Nobody is currently selling this exact item on either world.</p></div>'
					: '<div class="empty-state"><h3>No listings on '+esc(worldFilter)+'</h3><p>Try switching the world filter above.</p></div>';
				return;
			}

			var headerHtml =
				'<th data-k="seller-az">Seller</th><th>World</th><th>Type</th><th>Currency</th>'+
				'<th data-k="price-asc">Price</th>'+
				'<th data-k="stock-desc">In stock</th>'+
				'<th>Position</th>'+
				'<th data-k="recent">Last seen</th>'+
				'<th>Available since</th>';

			function buildRow(r){
				var manual = isManualListing(r);
				var stockCell = manual
					? '&infin;'+manualIcon("Added manually by an admin — stock isn't tracked for this listing.")
					: fmtNum(r.amount)+'<br><span class="price-sub">'+r.stacksInStock+' '+(r.bulk ? 'shulks' : r.stackSize === 64 ? 'stacks' : 'groups')+'</span>';
				var lastSeenCell = manual
					? 'None ('+esc(r.lastSeen)+')'+manualIcon("Added manually by an admin — there's no real scan time for this listing.")
					: relTime(r.lastSeen);
				var sellerUrl = sellerUrlFor(r);
				return '<tr>'+
					'<td class="seller">'+(sellerUrl ? '<a href="'+sellerUrl+'">'+esc(r.seller)+'</a>' : esc(r.seller))+'</td>'+
					'<td>'+esc(r.world)+'</td>'+
					'<td>'+
						(String(r.currency).toLowerCase() === "display" ? '<span class="badge display">Display</span>' : (r.bulk ? '<span class="badge bulk">Bulk</span>' : r.bundled ? '<span class="badge bundled">Bundled</span>' : '<span class="badge single">Single</span>'))+
						(r.mixedContents ? ' <span class="badge mixed">Mixed chest</span>' : '')+
					'</td>'+
					'<td class="currency-cell">'+esc(r.currency)+'</td>'+
					'<td><span class="price-main">'+esc(r.priceLabel)+'</span><br><span class="price-sub">per '+(r.bulk ? 'shulk' : r.stackSize)+'</span></td>'+
					'<td>'+stockCell+'</td>'+
					'<td class="position">'+esc(r.position)+'</td>'+
					'<td>'+lastSeenCell+'</td>'+
					'<td>'+availableSinceCell(r)+'</td>'+
				'</tr>';
			}

			itemPage = renderPaginatedRows(area, pag, rows, itemPage, headerHtml, buildRow,
				function onPageChange(p){ itemPage = p; renderItemTable(); },
				function onSortClick(key){ itemSort = key; itemPage = 1; renderItemTable(); });
		}

		// The generic /items/enchanted_book page (no ?name=) — since there's no
		// single "the" enchanted book to show graphs for, list every distinct
		// form currently for sale instead, each linking to its own real page
		// (?name=..., handled by loadItem above) with its own real stats.
		async function renderEnchantedBookDirectory(){
			var listingsRaw = await fetch(DATA_URL).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
			await loadItemLangTable();

			var byName = {}; // exact display name -> {name, count, worlds:Set}
			listingsRaw.forEach(function(r){
				if(String(r.baseItem||"").toLowerCase() !== "minecraft:enchanted_book") return;
				var display = localizedNameToEnglish(r.baseItem, r.itemName);
				if(!byName[display]) byName[display] = { name: display, count: 0, worlds: {} };
				byName[display].count++;
				byName[display].worlds[r.world] = true;
			});
			var forms = Object.keys(byName).map(function(k){ return byName[k]; }).sort(function(a,b){ return b.count - a.count; });

			var rowsHtml = forms.map(function(f){
				var worldsText = Object.keys(f.worlds).sort().join(", ");
				var url = "/items/enchanted_book?name=" + encodeURIComponent(f.name);
				return '<tr><td><a href="'+esc(url)+'">'+esc(f.name)+'</a></td>'+
					'<td>'+fmtNum(f.count)+' listing'+(f.count===1?'':'s')+'</td>'+
					'<td>'+esc(worldsText)+'</td></tr>';
			}).join("");

			var html = '<div class="item-header">'+
					'<img src="'+esc(catalogEntry.texture)+'" class="item-header-icon" alt="" onerror="this.style.visibility=\'hidden\'">'+
					'<div><h1 class="item-header-name">Enchanted Books</h1>'+
					'<p class="tag">Every enchantment/level combination is its own item, each with its own price history &middot; <a href="/items/">&larr; Item Library</a></p></div>'+
				'</div>'+
				(forms.length === 0
					? '<div class="empty-state"><h3>No enchanted books currently for sale</h3><p>Check back once someone lists one.</p></div>'
					: '<section class="table-card"><div class="table-toolbar"><span class="count">'+fmtNum(forms.length)+' current form'+(forms.length===1?'':'s')+'</span></div>'+
						'<div class="table-scroll"><table><thead><tr><th>Form</th><th>Listings</th><th>Worlds</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
					'</section>');
			document.getElementById("app").insertAdjacentHTML("beforeend", html);
		}

		async function loadItem(){
			var catalogResults = await Promise.all([
				fetch("/data/vanilla-items.json").then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
				fetch("/data/rare-items.json").then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
			]);
			var vanillaCatalog = catalogResults[0], rareCatalog = catalogResults[1];

			catalogEntry = vanillaCatalog.filter(function(it){ return it.id === slug; })[0] || null;
			if(!catalogEntry){
				catalogEntry = rareCatalog.filter(function(it){ return it.id === slug; })[0] || null;
				isRare = !!catalogEntry;
			}
			if(!catalogEntry){
				document.getElementById("app").innerHTML =
					'<div class="notfound"><h1>Item not found</h1>'+
					'<p>No catalog entry for "'+esc(slug)+'".</p>'+
					'<p><a href="/items/">&larr; Back to the Item Library</a></p></div>';
				return;
			}

			// Enchanted books all share one catalog entry (their own display name
			// is just "Enchanted Book" — the real name, e.g. "Sharpness V", only
			// ever shows up on the actual listing, see ShopEntryFactory). A
			// specific form's own page is /items/enchanted_book?name=Sharpness+V
			// (see itemLibraryUrlFor + the routing block above) — swap the generic
			// catalog entry for a synthetic one carrying that exact name, so
			// everything below (graphs, table, history) works exactly like any
			// other single real item. No ?name= at all means "the directory" —
			// list every form currently for sale instead of empty generic-name graphs.
			var isEnchantedBookGeneric = String(catalogEntry.baseItem||"").toLowerCase() === "minecraft:enchanted_book";
			if(isEnchantedBookGeneric && exactName){
				catalogEntry = { id: catalogEntry.id, baseItem: catalogEntry.baseItem, name: exactName, texture: catalogEntry.texture };
				isEnchantedBookGeneric = false;
			}
			if(isEnchantedBookGeneric){
				isEnchantedBookDirectory = true;
				document.title = "Enchanted Books — SC Trading Post";
				await renderEnchantedBookDirectory();
				return;
			}

			document.title = catalogEntry.name + " — SC Trading Post";
			renderSkeleton(catalogEntry);

			await loadItemLangTable();

			var listingsRaw = await fetch(DATA_URL).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
			var history;

			if(isRare){
				// No baseItem worth matching on for a rare item (many share a
				// generic vanilla item id) — match on display name alone, with
				// fuzzy tolerance for hand-typed shop-sign typos.
				currentListings = listingsRaw.filter(function(r){
					var display = localizedNameToEnglish(r.baseItem, r.itemName);
					return isRareNameMatch(display, catalogEntry.name);
				}).map(normalizeRow);

				// The backend still keys price history by exact (baseItem, name)
				// — same rule computeDailySnapshots() uses — so a typo'd listing's
				// history lives under its own key. Fetch every distinct key among
				// today's fuzzy-matched listings and merge them into one series.
				var keys = [], seenKeys = {};
				listingsRaw.forEach(function(r){
					var display = localizedNameToEnglish(r.baseItem, r.itemName);
					if(!isRareNameMatch(display, catalogEntry.name)) return;
					var k = "v:" + String(r.baseItem||"").toLowerCase() + "|" + display.toLowerCase();
					if(!seenKeys[k]){ seenKeys[k] = true; keys.push(k); }
				});
				var histArrays = await Promise.all(keys.map(function(k){
					return fetch(API_BASE + "/items/history?itemKey=" + encodeURIComponent(k)).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
				}));
				history = mergeHistoryArrays(histArrays);
			} else {
				// Matches worker.js's computeDailySnapshots() exactly — see its
				// comment for why baseItem + exact normalized name, not just baseItem.
				itemKey = "v:" + catalogEntry.baseItem.toLowerCase() + "|" + catalogEntry.name.toLowerCase();
				var canonicalName = catalogEntry.name.toLowerCase();
				currentListings = listingsRaw.filter(function(r){
					if(String(r.baseItem||"").toLowerCase() !== catalogEntry.baseItem.toLowerCase()) return false;
					var display = localizedNameToEnglish(r.baseItem, r.itemName);
					return display.toLowerCase() === canonicalName;
				}).map(normalizeRow);
				history = await fetch(API_BASE + "/items/history?itemKey=" + encodeURIComponent(itemKey)).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
			}

			var marketplaceHtml = renderMarketplaceSection(currentListings.filter(function(r){ return r.marketplace; }));
			if(marketplaceHtml) document.getElementById("app").insertAdjacentHTML("beforeend", marketplaceHtml);

			renderGraphs(history);
			renderItemTable();
		}

		loadItem();
	}
})();
</script>
</body>
