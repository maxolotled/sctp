<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Collection - SCTP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23101B14'/><circle cx='100' cy='100' r='60' fill='%23B7E23D'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
	:root{
		--bg:#101B14; --bg-rgb:16,27,20; --panel:#1B2A20; --panel-alt:#22332A; --line:#33453A;
		--muted:#8FA593; --text:#EAEFE7; --shell:#D9C89A;
		--accent:#B7E23D; --accent-rgb:183,226,61; --accent-dim:#87AE29; --accent-ink:#16210F;
		--info:#8C93E8; --warn:#E2A33D;
		--font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
	}
	*{box-sizing:border-box;}
	body{margin:0;background:radial-gradient(1200px 500px at 15% -10%, rgba(var(--accent-rgb),0.07), transparent 60%), var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.5;}
	a{color:var(--accent);}
	.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
	header.site{border-bottom:1px solid var(--line);padding:28px 0 22px;}
	.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:14px;}
	.brand-row{display:flex;align-items:center;gap:14px;min-width:0;}
	.brand-mark{flex:0 0 auto;width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:21px;}
	header.site h1{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:0.2px;margin:0 0 4px;}
	header.site .tag{color:var(--muted);font-size:14.5px;margin:0;}
	main{padding:28px 0 60px;}
	.login-cta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13.5px;}
	[hidden]{display:none!important;}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js" defer></script>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/beta/beta.css">
</head>
<body>

<header class="site">
	<div class="wrap">
		<div class="header-row">
			<div class="brand-row">
				<div class="brand-mark">🏆</div>
				<div>
					<h1>My Collection</h1>
					<p class="tag">Tick off the rare items and mapart you own, star the ones you want (your wishlist), per world &mdash; and see how far along you are.</p>
				</div>
			</div>
			<nav id="siteNavMount"></nav>
		</div>
	</div>
</header>

<main class="wrap">
	<div id="loginCta" class="login-cta" hidden>You need to be logged in to keep a collection. Log in from the button up top.</div>
	<div id="collectionHost"></div>
</main>

<script src="/beta/nav.js" defer></script>
<script src="/account-widget.js" defer></script>
<script src="/collection.js" defer></script>
<script src="/share-studio.js" defer></script>
<script>
(function(){
	"use strict";
	function load(){
		var s = window.sctpAccount ? window.sctpAccount.getSession() : null;
		var host = document.getElementById("collectionHost");
		document.getElementById("loginCta").hidden = !!s;
		host.innerHTML = "";
		if(s && window.sctpCollection) window.sctpCollection.mount(host, { editable: true });
	}
	window.sctpOnAccountChange = load;
	// Deferred scripts have all run by DOMContentLoaded.
	if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
	else load();
})();
</script>
</body>
</html>
